<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="tipcalc.css">
</head>
<body>
    <main class="tip-card">
        <p class="card-label">Tip Calculator</p>
        <h1 class="card-title">최종 결제 금액 계산</h1>

        <label class="input-group" for="food-price">
            <span class="input-label">음식 가격</span>
            <input id="food-price" type="number" min="0" step="0.01" placeholder="예: 25000">
        </label>

        <section class="tip-section" aria-label="팁 퍼센트 선택">
            <p class="tip-label">팁 퍼센트</p>
            <div class="tip-buttons">
                <button type="button" class="tip-button is-active" data-tip="10">10%</button>
                <button type="button" class="tip-button" data-tip="15">15%</button>
                <button type="button" class="tip-button" data-tip="20">20%</button>
            </div>
        </section>

        <section class="result-panel" aria-live="polite">
            <p class="result-label">최종 가격</p>
            <p class="result-value" id="total-price">0원</p>
            <p class="result-detail" id="result-detail">음식 가격을 입력하면 팁이 포함된 총액이 표시됩니다.</p>
        </section>
    </main>

    <script src="tipcalc.js"></script>
</body>
</html>
