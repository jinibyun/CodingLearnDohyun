<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍길동 | Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <main class="page-shell">
        <section class="business-card" aria-label="홍길동 명함 앞면">
            <div class="card-copy">
                <p class="eyebrow">BUSINESS CARD</p>
                <h1 class="name">홍길동</h1>
                <p class="role">QA Engineer</p>

                <dl class="details">
                    <div class="detail-row">
                        <dt>Experience</dt>
                        <dd>QA Career</dd>
                    </div>
                    <div class="detail-row">
                        <dt>Phone</dt>
                        <dd>416-999-9999</dd>
                    </div>
                </dl>
            </div>

            <aside class="qr-panel" aria-label="QR code area">
                <div class="fake-qr" id="fake-qr" aria-hidden="true"></div>
                <p class="qr-caption">Demo QR</p>
            </aside>
        </section>
    </main>

    <script src="profile.js"></script>
</body>
</html>
